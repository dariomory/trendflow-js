name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type check, unit tests, and build. The unit tests never touch the network.
      # The library itself has no dependencies and still supports Node 18.
      - name: Quality checks (library)
        run: npm run typecheck && npm run test && npm run build

      # The MCP server needs Node 20+: its Streamable HTTP transport comes from the MCP SDK,
      # which reaches @hono/node-server, and that requires >=20. The SDK's own `engines` says
      # >=18, which is why this only shows up as a test failure rather than an install error.
      - name: Quality checks (MCP server)
        if: matrix.node-version != '18.x'
        run: npm run build -w trendflow-mcp && npm run typecheck -w trendflow-mcp && npm run test -w trendflow-mcp

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches broken doc links before they reach Pages.
      - name: Build docs
        run: npm run docs
