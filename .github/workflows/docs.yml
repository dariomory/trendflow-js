name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions: {}

concurrency:
  group: docs-deploy
  # Let in-flight deployments finish to avoid a half-deployed site.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment

  refresh-canonical-docs:
    name: Refresh canonical docs
    needs: deploy
    runs-on: ubuntu-latest
    # The canonical site at trendflow.mory.dev renders the guides straight out of this repo,
    # so a docs change here should rebuild it. Skipped automatically on forks and wherever the
    # secret is unset, which keeps this a no-op rather than a failure.
    if: ${{ github.repository == 'dariomory/trendflow-js' }}
    steps:
      - name: Trigger the canonical docs rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Requested a rebuild of trendflow.mory.dev/docs."
