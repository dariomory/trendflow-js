name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Cache disabled to prevent cache-poisoning attacks on release artifacts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      # The tag tracks the library version. trendflow-mcp versions independently and is
      # published from whatever its own package.json says, so it is not checked here.
      - name: Verify the tag matches the library version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Quality checks
        run: npm run qa

      - name: Pack both packages
        run: |
          npm pack --pack-destination dist
          npm pack --workspace trendflow-mcp --pack-destination dist
          ls -l dist

      - name: Upload distribution
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which signs each package with this workflow's identity.
      id-token: write
      attestations: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/trendflow
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Download distribution
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/*.tgz"

      # trendflow-mcp bundles the library rather than depending on it, so the two publish
      # independently. The ./ on each path is required — npm reads a bare `dist/name.tgz`
      # as GitHub `owner/repo` shorthand and tries to clone it over SSH.
      - name: Publish trendflow
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "trendflow@${version}" version >/dev/null 2>&1; then
            echo "trendflow@${version} is already published — skipping."
          else
            tarball="$(ls dist/trendflow-[0-9]*.tgz)"
            npm publish "./${tarball}" --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish trendflow-mcp
        run: |
          version="$(node -p "require('./mcp/package.json').version")"
          # Skipped when unchanged, so a library-only release does not need an MCP bump.
          if npm view "trendflow-mcp@${version}" version >/dev/null 2>&1; then
            echo "trendflow-mcp@${version} is already published — skipping."
          else
            tarball="$(ls dist/trendflow-mcp-*.tgz)"
            npm publish "./${tarball}" --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
